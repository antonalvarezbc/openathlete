version: 2

# Security updates are always raised individually. Version updates are
# grouped weekly so they arrive as a few reviewable PRs instead of dozens.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Stripe SDK versions pin a Stripe API version: upgrade deliberately
      - dependency-name: stripe
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      docs:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
